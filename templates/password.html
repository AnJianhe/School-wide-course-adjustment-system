<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ 'rtl' if locale == 'ar' else 'ltr' }}">
<head><meta charset="UTF-8">
    {% include 'locale_data.html' %}<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ _('修改密码 - 全校调课系统') }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="login-container">
<h1>{{ _('修改密码') }}</h1>
{% if current_user.must_change_password %}<p>{{ _('请先修改初始密码，再使用系统。') }}</p>{% endif %}
{% if error %}<p class="error-message" role="alert">{{ _(error) }}</p>{% endif %}
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group"><label for="old_password">{{ _('当前密码') }}</label><input id="old_password" name="old_password" type="password" autocomplete="current-password" maxlength="128" required></div>
    <div class="form-group"><label for="new_password">{{ _('新密码（10～128 个字符）') }}</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
    <div class="form-group"><label for="confirm_password">{{ _('确认新密码') }}</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
    <button type="submit" class="btn-login">{{ _('保存密码') }}</button>
</form>
{% include 'navigation.html' %}
</main></body></html>
